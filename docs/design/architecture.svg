      <path d="M591 215l97 37" marker-start="url(#arrow)"/>
      <path d="M246 314h428" marker-start="url(#arrow)"/>
    </g>
    <g font-size="17" font-weight="700">
      <text x="460" y="103">Cloudflare Pages</text>
