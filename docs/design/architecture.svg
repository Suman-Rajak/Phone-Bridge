      <path d="M0 0l10 5-10 5z" fill="#366b59"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="20" fill="#f4f7f6"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#152822">
    <text x="460" y="40" font-size="24" font-weight="700">PhoneBridge</text>
    <g stroke="#81968a" stroke-width="2" fill="#fff">
      <rect x="338" y="65" width="244" height="64" rx="12"/>
      <rect x="330" y="172" width="260" height="84" rx="12"/>
      <rect x="25" y="252" width="213" height="104" rx="12"/>
      <rect x="682" y="252" width="213" height="104" rx="12"/>
    </g>
    <g stroke="#366b59" stroke-width="2" fill="none" marker-end="url(#arrow)">
