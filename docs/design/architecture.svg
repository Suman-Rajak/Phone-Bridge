<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title description">
  <title id="title">PhoneBridge connections</title>
  <desc id="description">The laptop and phone load the frontend, exchange setup messages through a Worker, and send user content over an encrypted peer connection.</desc>
